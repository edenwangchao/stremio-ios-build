name: Build Stremio iOS IPA

# 手动触发:Actions 页选本 workflow → Run workflow
on:
  workflow_dispatch:
    inputs:
      stremio_web_ref:
        description: "stremio-web 的分支或 tag(默认 development)"
        required: false
        default: "development"

permissions:
  contents: read

jobs:
  build-ipa:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Setup pnpm 11.8.0
        uses: pnpm/action-setup@v6.1.1
        with:
          version: 11.8.0
          run_install: false

      - name: Build stremio-web bundle
        run: bash scripts/build-web.sh "${{ inputs.stremio_web_ref || 'development' }}"

      - name: Compile iOS shell and package unsigned IPA
        run: bash scripts/build-ipa.sh

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Stremio-web-iOS15-unsigned-ipa
          path: build/Stremio-web-iOS15-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
